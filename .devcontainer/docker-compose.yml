services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Compartilha a rede com o banco: dentro do container, o Postgres
    # fica em "localhost:5432", exatamente como o .env.example espera.
    network_mode: service:db
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securelab
      POSTGRES_DB: securelab

volumes:
  postgres-data: